name: android
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**']
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: gradle test assembleDebug lint
      - name: No ads, billing or analytics (permission condition)
        run: "! grep -rEi 'admob|play-services-ads|billingclient|firebase-analytics|crashlytics' app/build.gradle.kts"
